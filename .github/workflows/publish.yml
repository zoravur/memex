name: Publish garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install garden
        run: go install github.com/zoravur/garden/cmd/garden@main
        env:
          GOPROXY: direct   # fetch from GitHub; proxy.golang.org serves @latest stale for a while after a push
      - name: Build site
        run: garden build -c .garden/garden.yaml -o "$GITHUB_WORKSPACE/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
